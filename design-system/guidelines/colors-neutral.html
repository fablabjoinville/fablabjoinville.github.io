<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font:var(--type-body);color:var(--text-body);background:var(--surface-page)}.l{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border-radius:var(--radius-2)}.sw b{font:var(--fw-semibold) 13px/1.2 var(--font-body)}.sw span{font:12px/1.2 var(--font-mono);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--flj-paper);box-shadow:inset 0 0 0 1px var(--border-subtle)"></i><b>Paper</b><span>#F5F3EE</span></div><div class="sw"><i style="background:var(--flj-gray-100);box-shadow:inset 0 0 0 1px var(--border-subtle)"></i><b>Gray 100</b><span>#EBE9E3</span></div><div class="sw"><i style="background:var(--flj-gray-200);"></i><b>Gray 200</b><span>#D9D6CE</span></div><div class="sw"><i style="background:var(--flj-gray-400);"></i><b>Gray 400</b><span>#9B978D</span></div><div class="sw"><i style="background:var(--flj-gray-600);"></i><b>Gray 600</b><span>#5C5A54</span></div><div class="sw"><i style="background:var(--flj-black);"></i><b>Black</b><span>#0B0B0B</span></div></div></body></html>
