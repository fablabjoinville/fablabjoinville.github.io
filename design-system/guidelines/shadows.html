<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font:var(--type-body);color:var(--text-body);background:var(--surface-page)}.l{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border-radius:var(--radius-2)}.sw b{font:var(--fw-semibold) 13px/1.2 var(--font-body)}.sw span{font:12px/1.2 var(--font-mono);color:var(--text-muted)}</style></head><body><div class="row" style="gap:28px;padding:4px"><div style="display:flex;flex-direction:column;gap:12px"><div style="width:110px;height:70px;background:#fff;border:2px solid var(--border-default);box-shadow:var(--shadow-offset-sm)"></div><span class="l">sm</span></div><div style="display:flex;flex-direction:column;gap:12px"><div style="width:110px;height:70px;background:#fff;border:2px solid var(--border-default);box-shadow:var(--shadow-offset)"></div><span class="l">default</span></div><div style="display:flex;flex-direction:column;gap:12px"><div style="width:110px;height:70px;background:#fff;border:2px solid var(--border-default);box-shadow:var(--shadow-offset-lg)"></div><span class="l">lg</span></div><div style="display:flex;flex-direction:column;gap:12px"><div style="width:110px;height:70px;background:#fff;border:2px solid var(--border-default);box-shadow:var(--shadow-offset-accent)"></div><span class="l">accent</span></div><div style="display:flex;flex-direction:column;gap:12px"><div style="width:110px;height:70px;background:#fff;border-radius:4px;box-shadow:var(--shadow-float)"></div><span class="l">float</span></div></div></body></html>
