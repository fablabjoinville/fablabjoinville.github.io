<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font:var(--type-body);color:var(--text-body);background:var(--surface-page)}.l{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border-radius:var(--radius-2)}.sw b{font:var(--fw-semibold) 13px/1.2 var(--font-body)}.sw span{font:12px/1.2 var(--font-mono);color:var(--text-muted)}</style></head><body><div class="row" style="gap:20px"><div style="display:flex;flex-direction:column;gap:6px"><div style="width:80px;height:64px;border:2px solid var(--border-default);border-radius:var(--radius-0)"></div><span class="l">0</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="width:80px;height:64px;border:2px solid var(--border-default);border-radius:var(--radius-1)"></div><span class="l">2px</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="width:80px;height:64px;border:2px solid var(--border-default);border-radius:var(--radius-2)"></div><span class="l">4px</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="width:80px;height:64px;border:2px solid var(--border-default);border-radius:var(--radius-3)"></div><span class="l">8px</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="width:80px;height:64px;background:var(--brand-primary);clip-path:polygon(var(--chamfer) 0,100% 0,100% 100%,0 100%,0 var(--chamfer))"></div><span class="l">chamfer</span></div></div></body></html>
