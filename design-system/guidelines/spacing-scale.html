<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font:var(--type-body);color:var(--text-body);background:var(--surface-page)}.l{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border-radius:var(--radius-2)}.sw b{font:var(--fw-semibold) 13px/1.2 var(--font-body)}.sw span{font:12px/1.2 var(--font-mono);color:var(--text-muted)}</style></head><body><div style="display:flex;align-items:flex-end;gap:14px"><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-1);height:var(--space-1);background:var(--brand-primary)"></div><span class="l">1</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-2);height:var(--space-2);background:var(--brand-primary)"></div><span class="l">2</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-3);height:var(--space-3);background:var(--brand-primary)"></div><span class="l">3</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-4);height:var(--space-4);background:var(--brand-primary)"></div><span class="l">4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-5);height:var(--space-5);background:var(--brand-primary)"></div><span class="l">5</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-6);height:var(--space-6);background:var(--brand-primary)"></div><span class="l">6</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-7);height:var(--space-7);background:var(--brand-primary)"></div><span class="l">7</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-8);height:var(--space-8);background:var(--brand-primary)"></div><span class="l">8</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-9);height:var(--space-9);background:var(--brand-primary)"></div><span class="l">9</span></div></div></body></html>
