<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font:var(--type-body);color:var(--text-body);background:var(--surface-page)}.l{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border-radius:var(--radius-2)}.sw b{font:var(--fw-semibold) 13px/1.2 var(--font-body)}.sw span{font:12px/1.2 var(--font-mono);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--flj-navy-300);"></i><b>Navy 300</b><span>#8A9AA5</span></div><div class="sw"><i style="background:var(--flj-navy-100);"></i><b>Navy 100</b><span>#DFE5E8</span></div><div class="sw"><i style="background:var(--flj-navy-50);box-shadow:inset 0 0 0 1px var(--border-subtle)"></i><b>Navy 50</b><span>#EEF2F4</span></div><div class="sw"><i style="background:var(--flj-white);box-shadow:inset 0 0 0 1px var(--border-subtle)"></i><b>White</b><span>#FFFFFF</span></div></div></body></html>
