<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Status colors with tinted backgrounds" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font:var(--type-body);color:var(--text-body);background:var(--surface-page)}.l{font:var(--type-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted)}.row{display:flex;gap:12px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.sw i{display:block;height:64px;border-radius:var(--radius-2)}.sw b{font:var(--fw-semibold) 13px/1.2 var(--font-body)}.sw span{font:12px/1.2 var(--font-mono);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><i style="background:var(--status-success-bg);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box"><em style="display:block;width:24px;height:24px;border-radius:2px;background:var(--status-success)"></em></i><b>Sucesso</b><span>--status-success</span></div><div class="sw"><i style="background:var(--status-warning-bg);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box"><em style="display:block;width:24px;height:24px;border-radius:2px;background:var(--status-warning)"></em></i><b>Atenção</b><span>--status-warning</span></div><div class="sw"><i style="background:var(--status-danger-bg);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box"><em style="display:block;width:24px;height:24px;border-radius:2px;background:var(--status-danger)"></em></i><b>Erro</b><span>--status-danger</span></div><div class="sw"><i style="background:var(--status-info-bg);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box"><em style="display:block;width:24px;height:24px;border-radius:2px;background:var(--status-info)"></em></i><b>Info</b><span>--status-info</span></div></div></body></html>
