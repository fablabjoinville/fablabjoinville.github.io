<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Fab Lab Joinville — Website</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><script src="data.js"></script>
<style>body{margin:0;font:var(--type-body);color:var(--text-body);background:var(--surface-page)}</style></head><body><div id="root"></div>
<script type="text/babel" src="Header.jsx"></script><script type="text/babel" src="Home.jsx"></script><script type="text/babel" src="Events.jsx"></script><script type="text/babel" src="Space.jsx"></script><script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">
function App(){
  const [page,setPage]=React.useState('inicio'); const [ev,setEv]=React.useState(null);
  const go=p=>{setEv(null);setPage(p);window.scrollTo(0,0);}; const openEvent=e=>{setEv(e);window.scrollTo(0,0);};
  let body; if(ev) body=<EventDetail ev={ev} back={()=>setEv(null)}/>; else if(page==='eventos') body=<Events openEvent={openEvent}/>; else if(page==='espaco') body=<Space/>; else if(page==='parceiros') body=<main><Partners/></main>; else body=<Home go={go} openEvent={openEvent}/>;
  return <><SiteHeader page={ev?'eventos':page} go={go}/>{body}<SiteFooter/></>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
